name: Documentation (Zensical)
run-name: ${{ github.event_name == 'push' && format('Push - {0}', github.ref_name) || github.event_name == 'release' && format('Release - {0}', github.event.release.tag_name) || format('Documentation - {0}', inputs.ref || github.ref_name) }}

# Experimental shared-toolkit rendering. The existing render.yml workflow and
# .render pipeline remain active until the new output has been accepted.
on:
  push:
    branches:
      - 'v[0-9]+.[0-9]+-dev'
      - 'v[0-9]+.[0-9]+.x'
      - 'publish-*'
  release:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch or tag to rebuild
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: amwa-documentation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docs:
    uses: AMWA-TV/amwa-spec-docs/.github/workflows/docs.yml@main
    with:
      versioned: true
      site-name: is-05
      public-docs-root: https://specs.amwa.tv/new/is-05
      source-ref: ${{ inputs.ref || github.ref_name }}
      toolkit-ref: main
    secrets: inherit
